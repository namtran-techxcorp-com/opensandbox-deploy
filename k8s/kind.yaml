# A local stand-in for techx-xora-nonprod-eks: Kubernetes 1.35 on arm64 nodes (Graviton there,
# Apple Silicon here), containerd, a CNI that enforces NetworkPolicy (Calico in place of the VPC
# CNI), a `workload: general` node like the general-arm64 group, and a tainted node in place of
# a dedicated sandbox node group.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: osb-nonprod
networking:
  # Calico replaces kindnet; 192.168.0.0/16 is Calico's default pool.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      workload: general
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      workload: sandbox
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: workload
              value: sandbox
              effect: NoSchedule
